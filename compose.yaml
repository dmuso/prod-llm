services:
  slidev:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3030:3030"
    environment:
      npm_config_update_notifier: "false"
      DECK: ${DECK:-meetup}
    # Entry first: --remote takes an optional password and would swallow a trailing path.
    command: sh -c 'npm install && npx slidev "decks/$$DECK/slides.md" --remote'
